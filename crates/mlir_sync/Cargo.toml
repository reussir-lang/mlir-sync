[package]
name = "mlir_sync"
version = "0.1.0"
edition = "2024"

[features]
# Provide a #[panic_handler] and rust_eh_personality for standalone runtime
# artifacts (staticlib/cdylib). Leave disabled when depending on this crate
# as a Rust library so the consumer (or std) supplies the panic machinery.
panic-handler = []

[lib]
crate-type = ["lib"]

[dependencies]
portable_futex = { path = "../portable_futex" }
